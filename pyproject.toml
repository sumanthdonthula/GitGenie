[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgenie-desktop"
version = "0.1.0"
description = "A local-first floating Git companion for VS Code"
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
gitgenie = "gitgenie.__main__:main"

[tool.setuptools.packages.find]
include = ["gitgenie*"]
